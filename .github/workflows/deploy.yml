name: Deploy CzasoPłaca to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare static PWA production bundle
        run: |
          mkdir -p dist/public
          cp -r public/* dist/
          cp public/gh-pages.css dist/public/gh-pages.css
          cp public/gh-pages.js dist/public/gh-pages.js
          cat << 'EOF' > dist/index.html
          <!doctype html>
          <html lang="pl" class="dark">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>CzasoPłaca — Licznik Godzin i Zarobków</title>
              <meta name="description" content="Aplikacja webowa do liczenia godzin pracy, autostartu, przeliczania stawki 31,50 zł/h na żywo oraz archiwum do 3 tygodni wstecz w LocalStorage." />
              <meta property="og:title" content="CzasoPłaca — Licznik Godzin i Zarobków" />
              <meta property="og:description" content="Aplikacja webowa do liczenia godzin pracy, autostartu, przeliczania stawki 31,50 zł/h na żywo oraz archiwum do 3 tygodni wstecz w LocalStorage." />
              <meta property="og:type" content="website" />
              <meta name="twitter:card" content="summary_large_image" />
              <meta name="theme-color" content="#020617" />
              <meta name="mobile-web-app-capable" content="yes" />
              <meta name="apple-mobile-web-app-capable" content="yes" />
              <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
              <meta name="apple-mobile-web-app-title" content="CzasoPłaca" />
              <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
              <link rel="icon" type="image/svg+xml" href="./icon.svg" />
              <link rel="manifest" href="./manifest.webmanifest" />
              <link rel="preconnect" href="https://fonts.googleapis.com" />
              <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
              <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
              <link rel="stylesheet" href="./public/gh-pages.css" />
            </head>
            <body class="bg-slate-950 text-slate-100">
              <div id="root"></div>
              <script type="module" src="./public/gh-pages.js"></script>
            </body>
          </html>
          EOF

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
